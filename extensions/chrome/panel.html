<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCS 對話轉移</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="app-header">
    <span class="app-name">PCS 對話轉移</span>
    <button id="refresh" class="icon-button" aria-label="重新讀取對話" title="重新讀取對話">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19.2 11a7.2 7.2 0 0 0-12-5.2L4 9m16 6-3.2 3.2A7.2 7.2 0 0 1 4.8 13"/></svg>
    </button>
  </header>

  <main>
    <section id="empty" class="empty-state">
      <h1 id="empty-title">讀取對話中…</h1>
      <button id="open-chatgpt" class="secondary" hidden>開啟 ChatGPT</button>
    </section>

    <section id="conversation" hidden aria-labelledby="conversation-title">
      <h1 id="conversation-title"></h1>
      <div class="selection-toolbar">
        <label class="check-label"><input id="select-all" type="checkbox" checked><span>全選</span></label>
        <span id="selection-count" class="muted"></span>
        <button id="preview-toggle" class="text-button">預覽</button>
      </div>
      <div id="messages" class="messages" aria-label="選取要轉移的訊息"></div>
      <section id="preview" hidden aria-label="選取內容預覽">
        <div id="preview-content" class="preview-content"></div>
      </section>
    </section>

    <section id="recent-section" class="recent-section" hidden aria-labelledby="recent-heading">
      <h2 id="recent-heading">最近保存</h2>
      <div id="recent-list"></div>
    </section>
  </main>

  <footer>
    <div id="feedback" class="feedback" role="status" aria-live="polite" hidden>
      <span id="feedback-text"></span>
      <button id="retry" class="text-button" hidden>重新連線</button>
      <button id="check-status" class="text-button" hidden>查詢結果</button>
      <button id="cancel" class="text-button" hidden>取消</button>
      <button id="new-selection" class="text-button" hidden>重新選取</button>
    </div>
    <div id="instances-row" class="instances-row" hidden>
      <label for="instances">送到</label><select id="instances"></select>
    </div>
    <button id="send" class="primary" disabled>送到 PCS</button>
    <div class="download-row">
      <label class="visually-hidden" for="download-format">檔案格式</label>
      <select id="download-format"><option value="json">JSON</option><option value="md">Markdown</option></select>
      <button id="download" class="secondary" disabled>下載檔案</button>
    </div>
  </footer>
  <script type="module" src="panel.mjs"></script>
</body>
</html>
